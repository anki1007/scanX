# scanX cloud refresh — runs the daily board crawls on GitHub's servers and
# pushes docs/data, so GitHub Pages stays fresh WITHOUT your desktop running.
#
# What it covers : PEAD board, Orders, Buybacks, Special, FII/FPI, Market Pulse,
#                  Sector Tailwind, TechnoFunda, Magic Formula, Fundamentals
#                  bundles, IV Ranking — everything the static site renders.
# What it can't  : live LTP ticks, the intraday engine, Ask-AI/AMA, live search
#                  (those need scanX.bat's local server by design).
#
# One-time setup on github.com -> repo -> Settings:
#   1. Secrets and variables -> Actions -> New repository secret:
#        SCREENER_EMAIL    = your screener.in login email
#        SCREENER_PASSWORD = your screener.in password
#      (Encrypted by GitHub; never visible in the repo or logs.)
#   2. Actions tab -> enable workflows if prompted.
#
# Schedule: 17:45 IST (12:15 UTC) Mon-Fri, after the daily close + results.
# Run it any time manually: Actions tab -> "scanX data refresh" -> Run workflow.
#
# Caveat, stated honestly: Screener sometimes throttles datacenter IPs (GitHub
# runners included). If a run fails with connect timeouts, the previous data
# simply stays live; your desktop scanX.bat remains the reliable fallback.

name: scanX data refresh

on:
  schedule:
    - cron: "15 12 * * 1-5"     # 17:45 IST, Mon-Fri
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scanx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PYTHONIOENCODING: utf-8
      SCANX_NO_DHAN: "1"                      # no broker token in the cloud
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      # SERVER-SIDE ONLY. Used by refresh_docinsights.py to bake concall/PPT/
      # annual-report analysis into static JSON here in CI. It is never written
      # into docs/, never sent to a browser, and no runtime endpoint uses it —
      # the site only ever serves the pre-baked result.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Read-only fundamentals token. Two steps here need it: the fundamentals
      # bake (current ratio + D/E proxy + peer ratios, which Screener's compact
      # statements cannot produce) and the wide-quotes pass. Without it both
      # silently fall back — which is exactly why the health panel kept showing
      # "n/a" after the ratio code shipped.
      UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (lean - no broker/browser extras)
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "pandas>=2.0" "numpy>=1.24" "requests>=2.31" \
            "beautifulsoup4>=4.12" "lxml>=5.0" "curl_cffi>=0.7" \
            "yfinance>=0.2.40" "pdfplumber>=0.10" "openpyxl>=3.1" "pyotp>=2.9" \
            "google-genai>=0.3"

      - name: Screener login
        run: python scripts/screener_login.py

      # The shared failure-tracking helper. Sourced by BOTH refresh steps so a
      # slow source never kills the run and every failure still turns it red at
      # the end, AFTER the good data has been committed.
      - name: Write the run helper
        run: |
          cat > "$RUNNER_TEMP/runner.sh" <<'SH'
          FAILED=""
          run() {
            echo "::group::$*"
            "$@"; rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then FAILED="$FAILED $2"; echo "::warning::$2 failed (rc=$rc)"; fi
          }
          SH

      # ---------------------------------------------------------------- phase 1
      # Deterministic boards: no API key, no per-company price, and the data the
      # site cannot do without. Committed BEFORE anything expensive runs.
      - name: Refresh boards
        id: refresh
        run: |
          set +e
          . "$RUNNER_TEMP/runner.sh"
          run python scripts/refresh_scanx.py --pages 8
          run python scripts/refresh_orders.py --months 3
          run python scripts/refresh_buybacks.py --months 12
          run python scripts/refresh_special.py
          run python scripts/refresh_fii.py
          run python scripts/refresh_marketpulse.py
          run python scripts/refresh_fpi.py
          run python scripts/refresh_sectors.py
          run python scripts/refresh_technofunda.py --mcap-floor 5 --screen-pages 250
          run python scripts/refresh_magicformula.py --screen-pages 250
          run python scripts/refresh_demergers.py
          run python scripts/refresh_marketmood.py
          run python scripts/refresh_auto.py --years 2
          # 1) keep the top names fresh (re-bake today's data)
          run python scripts/refresh_fundamentals.py --top 200 --skip-existing --max-minutes 45
          # 2) EXTEND coverage toward the whole universe (skip anything already baked);
          #    each daily run bakes more new stocks until every listed name is covered
          # completes in ~4s now the universe is fully baked; it only picks up
          # genuinely new listings, so it does not need a 90-minute allowance
          run python scripts/refresh_fundamentals.py --top 6000 --skip-any --max-minutes 25
          # Backfill the Upstox ratio/health block into bundles that already
          # exist. A normal bake skips anything baked today, so without this the
          # ~5,400 bundles written before the ratio feature would sit at "n/a"
          # forever — only newly-baked companies would ever show a current ratio.
          # Budget moved here from the pass above, which no longer needs it.
          # Measured throughput is ~63 companies/min, so 5,495 companies take
          # ~87 minutes of wall clock; with the freshness window the first two
          # runs finish the universe and every run after that only tops up what
          # has aged past --ratios-days.
          run python scripts/refresh_fundamentals.py --ratios-only --top 6000 --ratios-days 7 --max-minutes 60
          # banking heatmaps assemble from the bundles baked just above
          run python scripts/refresh_banking.py
          # advanced fundamental checklist - pure arithmetic over the bundles
          # already on disk, so it costs no network and must run AFTER them
          run python scripts/refresh_advanced.py
          # These three shipped with a refresh script that NO workflow ran, so
          # their boards froze the day they were first baked: sector medians and
          # the portfolio book were 12 days stale, STDRL 9. All read bundles
          # already on disk, so they cost no network and belong here, after the
          # fundamentals they derive from.
          run python scripts/refresh_sector_medians.py
          run python scripts/refresh_portfolio.py
          # four consecutive quarters of rising net profit - reads the quarterly
          # tables from the bundles above, so it costs no network either
          run python scripts/refresh_qprofit.py
          # STDRL trains reinforcement-learning agents. Two reasons it is gated
          # to one day rather than run nightly: it is a model comparison over
          # MONTHLY bars, so a daily re-run reproduces the same answer, and it
          # is the only board needing torch. Installing that costs a couple of
          # minutes, which is worth paying once a week and not six times.
          if [ "$(date -u +%u)" = "6" ]; then
            python -m pip install --quiet --disable-pip-version-check \
              --index-url https://download.pytorch.org/whl/cpu "torch" || true
            python -m pip install --quiet --disable-pip-version-check \
              "stable-baselines3>=2.0" "gymnasium>=0.29" || true
            run python scripts/refresh_stdrl.py --timesteps 20000 --cost-bps 25
          else
            echo "[stdrl] skipped - trains on Saturdays only"
          fi
          # daily close for EVERY baked company: the intraday quotes file only
          # covers ~500 board names, so without this ~90% of company pages fall
          # back to the price frozen into their bundle at bake time
          run python scripts/refresh_quotes.py --wide
          run python scripts/refresh_iv.py --per-sector 30
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          exit 0

      # The site never names its data vendor. This runs after every refresh
      # script and before the commit, so a script can be written without
      # thinking about the rule and a new one cannot reintroduce the leak.
      # Idempotent, and it never fails the run.
      - name: Redact data-source names
        if: always()
        run: python scripts/redact_sources.py || true

      - name: Commit & push board data
        run: |
          bash scripts/ci_commit.sh "data: cloud refresh"

      # ---------------------------------------------------------------- phase 2
      # LLM-priced boards, deliberately LAST and committed separately. These
      # consume a fixed 80 minutes of time budget between them, which is most of
      # the job's remaining headroom — so if a slow Screener day pushes the run
      # into the 200-minute job timeout, it dies HERE, after phase 1 is already
      # committed and live. Before this split a timeout threw away every board.
      - name: Refresh AI boards
        id: ai
        run: |
          set +e
          . "$RUNNER_TEMP/runner.sh"
          # concall / PPT / annual-report analysis, grounded in verbatim quotes
          run python scripts/refresh_docinsights.py --top 100 --skip-existing --max-minutes 25
          # bull vs bear debate — the only per-company priced board, so it stays
          # capped and skips anything already debated today
          run python scripts/refresh_debate.py --top 100 --rounds 3 --max-minutes 25
          # EXTEND debate coverage past the board into every baked company, a
          # time-boxed slice per day. --skip-any never pays twice for a company
          # already argued, so this walks the universe once and then costs
          # nothing but the new listings.
          run python scripts/refresh_debate.py --skip-any --top 6000 --rounds 2 --max-minutes 30
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          exit 0

      # Again after the AI boards: debate evidence carries a source URL per node.
      - name: Redact data-source names (AI boards)
        if: always()
        run: python scripts/redact_sources.py || true

      - name: Commit & push AI data
        if: always()
        run: |
          bash scripts/ci_commit.sh "data: AI boards"

      - name: Publish the run summary
        if: always()
        run: |
          {
            echo "## scanX refresh summary"
            F="${{ steps.refresh.outputs.failed }}${{ steps.ai.outputs.failed }}"
            if [ -n "$F" ]; then echo "Failed:$F"; else echo "All refresh steps succeeded"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface board failures
        if: steps.refresh.outputs.failed != '' || steps.ai.outputs.failed != ''
        run: |
          echo "These refresh steps failed:${{ steps.refresh.outputs.failed }}${{ steps.ai.outputs.failed }}"
          echo "Good data from the surviving steps was still committed above."
          exit 1
