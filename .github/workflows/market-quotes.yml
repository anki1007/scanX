# scanX market hours — quotes every ~15 minutes and the announcement-driven
# boards (PEAD results, market pulse, demergers, special situations, buybacks,
# orders) every hour, through IST trading hours, on GitHub's servers.
#
# One job loops through the session (scripts/ci_intraday.sh) instead of one
# job per cron tick. GitHub's shared scheduler fired the old 24-a-day cron
# about twice a weekday, so the "15-minute" quotes were two snapshots. Now the
# first firing that lands keeps going until 15:40 IST. A job may run 6 hours,
# less than the session, so a loop that reaches its time cap with the market
# still open dispatches its successor, which queues behind it and carries on.
# A firing that lands after the close runs one cycle and exits.
#
# For the full session regardless of GitHub's cron, dispatch it once before
# the open from any machine with the gh CLI (a VPS cron at 09:05 IST works):
#     gh workflow run market-quotes.yml -R anki1007/scanX
#
# Fundamentals stay nightly (refresh-data.yml): they only change when a
# company files results, and the bake that reads them takes over an hour.
#
# Best-effort by design: a source that blocks the runner this cycle leaves the
# previous file live; the next cycle tries again.

name: scanX market hours

on:
  schedule:
    # Offset minutes away from :00 get picked up more reliably. Window
    # 03:07-10:47 UTC = 08:37-16:17 IST, Mon-Fri. Any ONE of these landing
    # starts the loop for the rest of the session.
    - cron: "7,27,47 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write     # the loop dispatches its own successor (gh workflow run)

concurrency:
  group: scanx-quotes
  cancel-in-progress: false   # never cancel a run between its commit and push

jobs:
  market-hours:
    runs-on: ubuntu-latest
    # The loop stops itself at 15:40 IST or after 330 minutes, whichever is
    # first; this is only the backstop under GitHub's 6-hour job cap.
    timeout-minutes: 350
    env:
      PYTHONIOENCODING: utf-8
      SCANX_NO_DHAN: "1"
      SCANX_QUOTES_CLOUD: "1"       # NSE blocks datacenter IPs -> real-time BSE-direct (+ Yahoo gap-fill)
      # read-only Analytics token: prices the FULL baked universe, not just
      # the ~500 board names the BSE per-scrip endpoint can serve per cycle
      UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN }}
      # the hourly boards read logged-in feeds; one login per job, reused by
      # every cycle through the session file the login step writes
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "pandas>=2.0" "numpy>=1.24" "requests>=2.31" \
            "beautifulsoup4>=4.12" "lxml>=5.0" "curl_cffi>=0.7" \
            "yfinance>=0.2.40" "pdfplumber>=0.10" "pyotp>=2.9"

      - name: Login for the hourly boards
        # Quotes do not need it, so a failed login must not stop them.
        continue-on-error: true
        run: python scripts/screener_login.py

      - name: Quotes and boards until the close
        run: bash scripts/ci_intraday.sh
