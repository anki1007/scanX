# Upstox Lab — Upstox fundamentals ingestion (upstox_lab/) in the cloud.
#
# Requires ONE repository secret (Settings -> Secrets and variables -> Actions):
#   UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN  = your Upstox Analytics token
# The token lives ONLY in GitHub's encrypted secret store — never in the repo.
#
# Until the secret is set, runs exit early with a notice (never red).
# The DuckDB file is uploaded as a workflow artifact (gitignored, not committed).

name: upstox_lab sync

on:
  schedule:
    # Sunday 03:37 IST (Sat 22:07 UTC): markets closed and far from any
    # market-hours job on the VPS Quant Lab platform, which shares this
    # Upstox token — the two ingesters must never run at the same time.
    - cron: "7 22 * * 6"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (empty = full universe)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: upstox-lab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        id: gate
        run: |
          if [ -z "$UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN" ]; then
            echo "UPSTOX_FUNDAMENTAL_ANALYTICS_TOKEN secret is not set — skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: python -m pip install --quiet --disable-pip-version-check "requests>=2.31" "duckdb>=0.10" "apscheduler>=3.10"

      # Resumable. Each run used to start from an empty database and do a FULL
      # re-ingest; the API rate-limits that (400+ throttled calls a run), the
      # job hit its 120-minute cap every week from September, and a cancelled
      # run saved nothing -- so the next one started from zero again. Now the
      # database is carried between runs in the Actions cache, the sync is
      # incremental (fresh symbols are skipped), and it stops itself at 95
      # minutes so the save below always runs.
      - name: Restore the database from the last run
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: upstox_lab.duckdb
          key: upstox-lab-db-${{ github.run_id }}
          restore-keys: upstox-lab-db-

      - name: Run sync
        if: steps.gate.outputs.ready == 'true'
        run: |
          set +e
          if [ -n "${{ inputs.symbols }}" ]; then
            timeout --signal=INT 95m python -m upstox_lab sync --symbols "${{ inputs.symbols }}"
          else
            timeout --signal=INT 95m python -m upstox_lab sync
          fi
          rc=$?
          [ $rc -eq 124 ] && echo "Time budget reached - progress saved; the next run continues." | tee -a "$GITHUB_STEP_SUMMARY"
          python -m upstox_lab status | tee -a "$GITHUB_STEP_SUMMARY"
          [ $rc -eq 0 ] || [ $rc -eq 124 ] || exit $rc

      - name: Save the database for the next run
        if: always() && steps.gate.outputs.ready == 'true' && hashFiles('upstox_lab.duckdb') != ''
        uses: actions/cache/save@v4
        with:
          path: upstox_lab.duckdb
          key: upstox-lab-db-${{ github.run_id }}

      - name: Upload database artifact
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstox-lab-duckdb
          path: upstox_lab.duckdb
          retention-days: 30
          if-no-files-found: warn
