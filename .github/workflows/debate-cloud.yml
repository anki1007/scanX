# Bake the debate boards in the cloud, so nobody's laptop has to stay on.
#
# The local runner (run-ai-server.ps1) works but needs a machine switched on for
# days. This does the same work on Actions runners, which are free and unmetered
# for a public repository, and it runs on a schedule whether anyone is awake.
#
# Shape: plan -> warm -> bake (matrix) -> collect.
#
#   plan     works out who still has no debate, largest company first, and
#            round-robins them into disjoint shards.
#   warm     pulls the model ONCE into a cache. Without this every shard would
#            pull the same 2GB on a cold cache, simultaneously.
#   bake     one job per shard, each writing to a SCRATCH directory and
#            uploading only what it produced. Shards never touch the same file,
#            so there is no push race and a shard that dies costs only its slice.
#   collect  merges the artifacts, rebuilds the index, commits once.
#
# Nothing here is destructive: a company already debated is never re-argued, and
# an interrupted run simply leaves those companies in the next run's backlog.
name: scanX debate (cloud)

on:
  schedule:
    # Every 6 hours. The universe is ~5,150 companies at the time of writing;
    # the run summary prints the rate so this can be tuned against reality
    # rather than against my arithmetic.
    - cron: "40 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel bake jobs"
        default: "6"
      minutes:
        description: "Bake minutes per shard (job hard-stops at 350)"
        default: "280"
      model:
        description: "Ollama model"
        default: "qwen2.5:3b"
      rounds:
        description: "Debate rounds per company"
        default: "2"

# One run at a time. Two overlapping runs would bake the same backlog twice and
# then fight over the same commit.
concurrency:
  group: debate-cloud
  cancel-in-progress: false

permissions:
  contents: write

env:
  OLLAMA_VERSION: "0.32.5"
  OLLAMA_MODEL: ${{ github.event.inputs.model || 'qwen2.5:3b' }}
  SHARDS: ${{ github.event.inputs.shards || '6' }}
  BAKE_MINUTES: ${{ github.event.inputs.minutes || '280' }}
  ROUNDS: ${{ github.event.inputs.rounds || '2' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      remaining: ${{ steps.split.outputs.remaining }}
      needs_ollama: ${{ steps.split.outputs.needs_ollama }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Spread the shards across EVERY model we hold a credential for. Eight
      # shards on one provider just hit that provider's rate limit eight times
      # faster; eight providers running one stream each are eight independent
      # quotas and eight independent outages. ollama is always available since
      # it needs no key, so the list is never empty.
      - id: split
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          set -euo pipefail
          POOL=""
          add() { [ -n "${2:-}" ] && POOL="${POOL:+$POOL,}$1" || true; }
          add gemini    "${GEMINI_API_KEY:-}"
          add openai    "${OPENAI_API_KEY:-}"
          add anthropic "${ANTHROPIC_API_KEY:-}"
          add deepseek  "${DEEPSEEK_API_KEY:-}"
          add mistral   "${MISTRAL_API_KEY:-}"
          add qwen      "${QWEN_API_KEY:-}"
          add together  "${TOGETHER_API_KEY:-}"
          POOL="${POOL:+$POOL,}ollama"          # needs no key; always last resort
          echo "provider pool: $POOL"
          python scripts/debate_shards.py --shards "$SHARDS" \
            --providers "$POOL" --github-output "$GITHUB_OUTPUT"
      # Block scalar, not a plain one: the message contains ": ", which YAML
      # reads as a mapping key inside an unquoted value.
      - run: |
          echo "### Debate backlog: ${{ steps.split.outputs.remaining }} companies" >> "$GITHUB_STEP_SUMMARY"

  warm:
    needs: plan
    if: needs.plan.outputs.remaining != '0' && needs.plan.outputs.needs_ollama == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1
      - name: Install ollama
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Pinned release asset from the official repo, not a piped install
          # script: reproducible, and the version is visible in the diff.
          # The asset is .tar.zst, NOT .tgz -- ollama moved to zstd, and the
          # old name 404s. Runners ship zstd, so tar --zstd works.
          curl -fsSL -o /tmp/ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          sudo tar -C /usr --zstd -xf /tmp/ollama.tar.zst
          ollama --version
      - name: Pull the model into the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull "$OLLAMA_MODEL"
          du -sh ~/.ollama/models || true

  bake:
    needs: [plan, warm]
    # always(), because `warm` is SKIPPED on a round where no shard runs the
    # local model -- and a skipped dependency skips everything behind it. That
    # is how a completely green run baked nothing at all: plan succeeded, warm
    # was skipped, bake and collect went with it, and the only symptom was the
    # backlog not moving. Guarded on plan actually succeeding so a broken plan
    # still stops the run.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.remaining != '0'
    runs-on: ubuntu-latest
    # The hard ceiling is 360. Leave room for checkout, model restore and upload
    # so a shard is never killed mid-write.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same set the data-refresh workflow proved against this script.
      # google-genai is included ONLY on a gemini shard: that adapter imports it
      # lazily, so without the package a gemini-pinned shard reports "no
      # credentials" and bakes nothing, silently. Every other provider speaks
      # plain HTTP through requests.
      - name: Install dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "pandas>=2.0" "numpy>=1.24" "requests>=2.31" \
            "beautifulsoup4>=4.12" "lxml>=5.0" "curl_cffi>=0.7" \
            "yfinance>=0.2.40" "pdfplumber>=0.10" "openpyxl>=3.1"
          if [ "${{ matrix.provider }}" = "gemini" ]; then
            python -m pip install --quiet --disable-pip-version-check "google-genai>=0.3"
          fi

      # Only the local-model shards need 2GB of weights and a server. A hosted
      # shard skipping this starts baking about four minutes sooner.
      - uses: actions/cache@v4
        if: matrix.provider == 'ollama' || matrix.provider == ''
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1

      - name: Start ollama
        if: matrix.provider == 'ollama' || matrix.provider == ''
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          sudo tar -C /usr --zstd -xf /tmp/ollama.tar.zst
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama list

      - name: Bake shard ${{ matrix.shard }} on ${{ matrix.provider || 'default' }} (${{ matrix.n }} companies)
        env:
          SCANX_LLM_PROVIDER: ${{ matrix.provider }}
          # Every key is exported to every shard, but --provider pins which one
          # this shard may use. Exporting them all keeps the step definition
          # identical across the matrix; the pin is what separates the quotas.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          # Must be a full URL. The adapter appends "/api/generate" to this
          # verbatim, so a bare host:port yields a schemeless URL and every
          # call fails.
          OLLAMA_HOST: http://127.0.0.1:11434
          PYTHONIOENCODING: utf-8
          # A CPU runner needs 90-160s for one debate turn. At the 90s default
          # the call timed out, the turn was dropped, and companies came back
          # with "2 turns over 1 rounds" instead of 4 over 2 -- quietly half a
          # debate, which is worse than none. A hosted model answers in seconds
          # and does not need this, but the ceiling costs it nothing.
          SCANX_LLM_TIMEOUT: "420"
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/shard-out"
          # --top 0 means "no board names": this shard bakes EXACTLY the codes
          # it was handed, which is what keeps the shards disjoint.
          python scripts/refresh_debate.py \
            --top 0 --codes "${{ matrix.codes }}" \
            --rounds "$ROUNDS" --focus \
            --provider "${{ matrix.provider }}" \
            --out "$RUNNER_TEMP/shard-out" \
            --max-minutes "$BAKE_MINUTES"
          n=$(find "$RUNNER_TEMP/shard-out" -maxdepth 1 -name '*.json' ! -name 'index.json' | wc -l)
          echo "shard ${{ matrix.shard }}: baked $n of ${{ matrix.n }} in ${BAKE_MINUTES}min"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debate-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-out
          if-no-files-found: ignore
          retention-days: 1

  collect:
    needs: [plan, bake]
    # always(): a shard that timed out still produced real debates, and they are
    # worth publishing. Losing four hours of baking because a fifth shard died
    # is exactly the failure this split exists to prevent.
    if: always() && needs.plan.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/shards
          pattern: debate-shard-*
          merge-multiple: false

      - name: Merge shards and rebuild the index
        run: bash scripts/ci_merge_debates.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # REPLAY, never merge. Both the local runner and the nightly refresh
          # push to this branch, and when either added the same company that a
          # shard just baked, `git rebase` hit an add/add conflict it cannot
          # resolve. The loop gave up and TWO runs of ~4.8 hours were discarded
          # with every debate in them.
          #
          # There is nothing to merge here: these are independent per-company
          # files. So on a rejected push we reset the tree to whatever is now on
          # main and lay the shard artifacts back on top. cp -n means the copy
          # already on main wins, which only has to be deterministic -- both
          # sides are valid debates for that company.
          for n in 1 2 3 4 5; do
            git add docs/data/debate
            if git diff --cached --quiet; then
              echo "nothing new to publish"; exit 0
            fi
            git commit -q -m "debate: cloud bake +${ADDED} (${TOTAL} total)"
            if git push -q origin HEAD:main; then echo "pushed on attempt ${n}"; exit 0; fi

            echo "push rejected, replaying onto the new tip (attempt ${n})"
            git fetch -q origin main
            git reset -q --hard origin/main
            bash scripts/ci_merge_debates.sh
          done
          echo "could not push after 5 replays" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Debate bake"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| backlog at start | ${{ needs.plan.outputs.remaining }} |"
            echo "| baked this run | ${ADDED:-0} |"
            echo "| total on disk | ${TOTAL:-0} |"
            echo "| model | ${OLLAMA_MODEL} |"
          } >> "$GITHUB_STEP_SUMMARY"
